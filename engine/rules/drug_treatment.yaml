# NON-OVERRIDABLE (P17). Drug / treatment claims. DRAFT until consultant sign-off (P20).
# A cosmetic may not claim to diagnose, treat, mitigate or prevent disease or to affect body function.
anchors:
  dc_act: &dc_act
    ref: "Drugs and Cosmetics Act, 1940"
    provision: "s.3(b) definition of 'drug' (diagnosis, treatment, mitigation or prevention of disease; affecting structure or function of the body) versus s.3(aaa) definition of 'cosmetic'"
    verified: false
  cosmetics_rules: &cosmetics_rules
    ref: "Cosmetics Rules, 2020 (G.S.R. 763(E), 15 Dec 2020)"
    provision: "r.34 (labelling) and r.36 (false or misleading claims); pin-points from the agent pre-review, to be confirmed by the consultant"
    verified: false
  ccpa: &ccpa
    ref: "Guidelines for Prevention of Misleading Advertisements and Endorsements for Misleading Advertisements, 2022 (CCPA)"
    provision: "misleading advertisement; claim substantiation"
    verified: false

rules:
  - id: EN-DRUG-001
    category: drug_treatment
    title: "Treatment or cure of a skin disease or medical condition"
    severity: red
    overridable: false
    explanation: "A cosmetic cannot claim to treat, cure or heal a disease or medical condition. Such a claim makes the product a drug."
    rewrite_hint: "Describe the cosmetic effect instead, for example 'cleanses oily skin' or 'for acne-prone skin'."
    patterns:
      - kind: verb_condition
        verbs: ["treat*", "cure*", "heal", "heals", "healed", "healing", "relieve*", "alleviate*", "remedy", "remedies", "mitigate*"]
        conditions:
          - "acne"
          - "pimple"
          - "pimples"
          - "eczema"
          - "psoriasis"
          - "dermatitis"
          - "rosacea"
          - "infection"
          - "infections"
          - "fungal"
          - "ringworm"
          - "scabies"
          - "warts"
          - "wound"
          - "wounds"
          - "burns"
          - "rash"
          - "rashes"
          - "allergy"
          - "allergies"
          - "boils"
          - "hives"
          - "alopecia"
          - "skin disease*"
          - "skin disorder*"
          - "skin condition*"
          - "medical condition*"
        max_gap: 4
    sources: [*dc_act, *cosmetics_rules, *ccpa]
    examples:
      positive:
        - "Cures eczema in just 7 days."
        - "This cream treats acne and pimples fast."
        - "Heals fungal infections of the skin."
      negative:
        - "Gentle face wash for acne-prone skin."
        - "Cleanses oily skin without drying it out."
    open_questions:
      - "Is 'soothes' or 'relieves' acceptable for visible irritation (redness, dryness) without naming a disease? The draft flags 'relieve*' only next to a named condition."
      - "'Treatment' is flagged next to a condition, so 'spot treatment for acne' is red. Confirm this is the right line for 'spot treatment' products."

  - id: EN-DRUG-002
    category: drug_treatment
    title: "Prevention of disease or infection"
    severity: red
    overridable: false
    explanation: "A cosmetic cannot claim to prevent disease or infection, or to protect against it. Such a claim makes the product a drug."
    rewrite_hint: "Describe what the product does to the skin's look or feel. Do not mention disease."
    patterns:
      - kind: verb_condition
        verbs: ["prevent*", "protect", "protects", "protecting", "fight", "fights", "fighting", "combat*", "kill", "kills", "killing"]
        conditions:
          - "disease"
          - "diseases"
          - "infection"
          - "infections"
          - "illness"
          - "illnesses"
          - "virus"
          - "viruses"
          - "viral"
          - "covid"
          - "covid-19"
          - "coronavirus"
        max_gap: 4
    sources: [*dc_act, *ccpa]
    examples:
      positive:
        - "Prevents skin infections naturally."
        - "Protects your family against viral infections."
        - "Helps prevent disease."
      negative:
        - "Protects skin from dryness."
        - "Prevents moisture loss for 24 hours."
    open_questions:
      - "Standard disclaimers such as 'not intended to diagnose, treat, cure or prevent any disease' are allowlisted (AL-001). Confirm that wording is acceptable on a listing."

  - id: EN-DRUG-003
    category: drug_treatment
    title: "Claim to change a body function (hormones, immunity, circulation, metabolism)"
    severity: red
    overridable: false
    explanation: "A cosmetic cannot claim to affect how the body works internally. That is a drug claim under the 'structure or function' limb of the drug definition."
    rewrite_hint: "Limit the claim to the skin or hair surface: how it looks, feels or is cleansed."
    patterns:
      - kind: verb_condition
        verbs: ["regulate*", "balance", "balances", "balancing", "boost", "boosts", "boosting", "stimulate*", "improve", "improves", "improving", "increase*", "lower", "lowers", "lowering", "reduce", "reduces", "reducing", "restore", "restores", "detoxify", "detoxifies"]
        conditions:
          - "hormone"
          - "hormones"
          - "hormonal"
          - "metabolism"
          - "immunity"
          - "immune system"
          - "blood circulation"
          - "blood flow"
          - "blood sugar"
          - "cholesterol"
          - "insulin"
          - "thyroid"
          - "bloodstream"
          - "internal organs"
          - "liver"
          - "kidney"
          - "kidneys"
        max_gap: 3
    sources: [*dc_act]
    examples:
      positive:
        - "Balances hormones naturally."
        - "Boosts your immunity from the first use."
        - "Improves blood circulation in the scalp."
      negative:
        - "Boosts skin radiance."
        - "Improves the look of skin texture."
    open_questions:
      - "Scalp or body massage oils often say 'improves blood circulation'. Is that a drug claim, or accepted as a massage effect? The draft treats it as a drug claim."

  - id: EN-DRUG-004
    category: drug_treatment
    title: "Prescription or medicinal product language"
    severity: red
    overridable: false
    explanation: "Words like 'medicated' or 'prescription strength' present the product as a medicine, not a cosmetic."
    rewrite_hint: "Remove the medicinal wording. Describe the formula by its ingredients and cosmetic purpose."
    patterns:
      - kind: phrase
        phrases:
          - "prescription strength"
          - "prescription-strength"
          - "prescribed by doctors"
          - "prescribed by dermatologists"
          - "doctor prescribed"
          - "doctor-prescribed"
          - "dermatologist prescribed"
          - "dermatologist-prescribed"
          - "medicated"
          - "is a medicine"
          - "acts as a medicine"
          - "works like a medicine"
          - "pharmaceutical grade"
          - "pharmaceutical-grade"
    sources: [*dc_act, *cosmetics_rules]
    examples:
      positive:
        - "Doctor-prescribed strength anti-acne gel."
        - "Medicated shampoo for the scalp."
        - "Prescription strength formula."
      negative:
        - "Gentle daily moisturiser for dry skin."
        - "Contains herbal extracts."
    open_questions:
      - "Should 'medicinal herbs' or 'dermatologist-formulated' be allowlisted? The draft flags neither."

  - id: EN-DRUG-005
    category: drug_treatment
    title: "Hair regrowth or reversal of hair loss"
    severity: red
    overridable: false
    explanation: "Claiming to regrow hair or reverse hair loss is a treatment claim (the reference product for this effect is a drug)."
    rewrite_hint: "Talk about the look and feel of existing hair, for example 'nourishes hair' or 'helps hair feel fuller'."
    patterns:
      - kind: verb_condition
        verbs: ["regrow*", "re-grow*", "regenerate*", "revive*", "reactivate*"]
        conditions: ["hair", "hairs", "follicle", "follicles", "hair follicles"]
        max_gap: 3
      - kind: phrase
        phrases: ["hair regrowth", "hair re-growth", "new hair growth", "reverse hair loss", "reverses hair loss", "reverse baldness", "reverses baldness"]
    sources: [*dc_act, *ccpa]
    examples:
      positive:
        - "Regrow hair in 30 days."
        - "Clinically visible hair regrowth."
        - "Reactivates dormant hair follicles."
      negative:
        - "Nourishes hair from root to tip."
        - "Leaves hair feeling fuller and softer."
    open_questions:
      - "'Promotes hair growth' and 'reduces hair fall' are handled as overridable orange claims (EN-CLAIM-010). Confirm they belong there and not here."
