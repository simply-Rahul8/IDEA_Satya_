  - id: HI-FAIR-001
    category: fairness
    maps_to: EN-FAIR-001
    title: "Claim to lighten, whiten or make skin fairer (Hindi)"
    explanation: "Claims that a product makes skin fairer, lighter or whiter are blocked. They imply lighter skin is better and are not allowed in listings."
    rewrite_hint: "Describe the care benefit instead, for example 'helps skin look even and radiant'."
    patterns:
      - kind: verb_condition
        form: devanagari
        verbs: ["गोर*", "सफेद कर*", "उजला*", "उजली", "उजले", "गोरा", "गोरी"]
        conditions: ["त्वचा", "त्वचा को", "रंग", "रंगत", "चेहरा", "चेहरे", "चेहरे को", "शरीर", "बगल"]
        max_gap: 3
      - kind: phrase
        form: devanagari
        phrases: ["गोरापन", "गोरेपन", "फेयरनेस", "फेअरनेस", "फेयर एंड", "गोरा रंग", "गोरी त्वचा", "स्किन व्हाइटनिंग", "व्हाइटनिंग क्रीम", "व्हाइटनिंग सीरम", "व्हाइटनिंग फेस वॉश"]
      - kind: verb_condition
        form: transliterated
        verbs: ["gor*", "safed kar*", "ujal*"]
        conditions: ["twacha", "tvacha", "rang", "rangat", "chehra", "chehre", "sharir", "skin"]
        max_gap: 3
      - kind: phrase
        form: transliterated
        phrases: ["goraapan", "gorapan", "gora rang", "gori twacha", "fairness", "skin whitening"]
      - kind: verb_condition
        form: hinglish
        verbs: ["gor*", "gora", "gori", "गोर*", "whiten*", "lighten*", "fair"]
        conditions: ["skin", "chehra", "rang", "त्वचा", "रंग", "चेहरा", "complexion", "face"]
        max_gap: 3
      - kind: phrase
        form: hinglish
        phrases: ["fairness क्रीम", "whitening क्रीम", "गोरेपन की cream", "fair skin", "गोरी skin"]
    examples:
      hi_positive:
        - { text: "सिर्फ सात दिन में गोरापन पाएं।", form: devanagari }
        - { text: "यह क्रीम आपकी त्वचा को गोरा करती है।", form: devanagari }
        - { text: "Gora rang paane ke liye yeh cream lagayein.", form: transliterated }
        - { text: "Chehra gora kare, sirf 7 din mein.", form: transliterated }
        - { text: "Fairness क्रीम जो skin को गोरी बनाए।", form: hinglish }
      hi_negative:
        - { text: "यह क्रीम त्वचा को नमी देती है और रंगत को निखारती है।", form: devanagari }
        - { text: "फ़ाउंडेशन 24 शेड्स में उपलब्ध।", form: devanagari }
        - { text: "Chehre ko saaf aur taza rakhta hai.", form: transliterated }
        - { text: "Dry skin ke liye hydrating moisturiser.", form: hinglish }
      en_positive:
        - "Whitens your skin in 7 days."
        - "A fairness cream for glowing faces."
      en_negative:
        - "Foundation in 24 shades from fair to deep."
        - "Brightening vitamin C serum for dull skin."
    open_questions:
      - "'रंगत निखारे' (improves complexion/glow) is allowed in this draft. Is it, or does it imply colour change?"
      - "'गोर*' is a prefix wildcard. Names such as 'गोरखपुर' only flag next to a skin word within three words. Acceptable?"
      - "Is 'उजला' (bright, clear) used for skin a fairness claim? The draft flags 'उजला*' next to a skin word."

  - id: HI-FAIR-002
    category: fairness
    maps_to: EN-FAIR-002
    title: "Darkness presented as a defect to remove (Hindi)"
    explanation: "Presenting dark or dusky skin as a problem to remove or fix is blocked."
    rewrite_hint: "Describe a care benefit that does not refer to skin colour."
    patterns:
      - kind: verb_condition
        form: devanagari
        verbs: ["हटा*", "दूर कर*", "मिटा*", "ठीक कर*", "खत्म कर*", "से छुटकारा", "अलविदा"]
        conditions: ["सांवलापन", "सांवलेपन", "सांवला रंग", "सांवली त्वचा", "काली त्वचा", "काला रंग", "डार्क स्किन", "सांवली", "सांवला"]
        max_gap: 3
      - kind: verb_condition
        form: transliterated
        verbs: ["hata*", "door kar*", "dur kar*", "mita*", "thik kar*", "khatam kar*", "chhutkara"]
        conditions: ["sanvlapan", "sanvla rang", "sanvli twacha", "kali twacha", "kala rang", "dark skin", "sanvli", "sanvla"]
        max_gap: 3
      - kind: verb_condition
        form: hinglish
        verbs: ["हटा*", "दूर कर*", "hata*", "door kar*", "dur kar*", "remove*", "fix*", "get rid of"]
        conditions: ["dark skin", "dusky skin", "सांवलापन", "सांवली त्वचा", "sanvlapan", "काली त्वचा"]
        max_gap: 3
    examples:
      hi_positive:
        - { text: "सांवलापन हटाएं, पाएं निखार।", form: devanagari }
        - { text: "काली त्वचा को दूर करे यह क्रीम।", form: devanagari }
        - { text: "Sanvlapan door karein sirf ek hafte mein.", form: transliterated }
        - { text: "Dark skin ko hatayein, पाएं साफ़ त्वचा।", form: hinglish }
      hi_negative:
        - { text: "सांवली त्वचा के लिए बनाया गया फाउंडेशन शेड।", form: devanagari }
        - { text: "Sanvli twacha ke liye gehre shades.", form: transliterated }
        - { text: "Deep shades for dusky skin tones.", form: hinglish }
      en_positive:
        - "Removes dark skin."
      en_negative:
        - "Deep shades designed for dusky skin tones."
    open_questions:
      - "Shade-range wording ('सांवली त्वचा के लिए शेड') is allowed. Does the reviewer agree it reads as inclusive and not as a defect?"
      - "Please give the common Hindi terms used for dark or dusky skin in listings, and mark which are slurs."

allowlist:
  - id: AL-HI-001
    phrases:
      - "किसी रोग के निदान उपचार इलाज या रोकथाम के लिए नहीं है"
      - "किसी रोग का निदान उपचार इलाज या रोकथाम करने के लिए नहीं है"
      - "किसी बीमारी का इलाज नहीं करता"
      - "रोग के निदान उपचार या रोकथाम के लिए नहीं है"
    applies_to: ["HI-DRUG-001", "HI-DMR-001"]
    note: "Standard Hindi negative disclaimer. It denies the drug claim, so it must not be flagged as one."
    examples:
      - "यह उत्पाद किसी रोग के निदान, उपचार, इलाज या रोकथाम के लिए नहीं है।"

  - id: AL-HI-002
    phrases:
      - "दाँतों को गोरा"
      - "दांतों को सफेद"
      - "दांत सफेद"
      - "दाँत सफेद"
    applies_to: ["HI-FAIR-001"]
    note: "Teeth whitening is not skin lightening."
    examples:
