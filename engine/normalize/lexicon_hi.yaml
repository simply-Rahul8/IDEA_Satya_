# Hindi lexicon (DRAFT). NOT reviewed by a native Hindi speaker or a regulatory consultant (plan P20, SAT-5).
# Mirrors the non-overridable English rules (P17) in three written forms:
#   devanagari     Devanagari script
#   transliterated Hindi words in Roman letters (ilaaj, gori)
#   hinglish       code-switched mix (Hindi verb with an English condition, or the reverse)
# Matching folds nukta, chandrabindu, Devanagari digits and zero-width characters, and collapses Roman spelling
# variants (aa/a, ee/i, oo/u, w/v, z/j), so list one spelling per variant. A trailing * is a prefix wildcard.
# Hindi is verb-final, so verb_condition defaults to order: any.
# Bump `version` on any change. Status flips to SIGNED_OFF only after the reviewer's written decision is logged in
# engine/normalize/README.md.
lexicon:
  name: satya-hi
  version: "0.1.0"
  status: DRAFT
  language: hi
  updated: "2026-11-05"
  reviewer: "native Hindi reviewer (SAT-5), pending"

rules:
  - id: HI-DRUG-001
    category: drug_treatment
    maps_to: EN-DRUG-001
    title: "Treatment or cure of a skin disease or medical condition (Hindi)"
    explanation: "A cosmetic cannot claim to treat, cure or heal a disease or medical condition. Such a claim makes the product a drug."
    rewrite_hint: "Describe the cosmetic effect instead, for example 'cleanses oily skin' or 'for acne-prone skin'."
    patterns:
      - kind: verb_condition
        form: devanagari
        verbs: ["ठीक कर*", "ठीक हो*", "इलाज*", "उपचार*", "चिकित्सा", "निदान", "रामबाण", "रोग मुक्त*", "मुक्ति"]
        conditions:
          - "मुंहासे"
          - "मुहांसे"
          - "मुंहासों"
          - "पिंपल*"
          - "दाने"
          - "एक्जिमा"
          - "एग्जिमा"
          - "सोरायसिस"
          - "दाद"
          - "रोसेशिया"
          - "डर्मेटाइटिस"
          - "संक्रमण*"
          - "इन्फेक्शन*"
          - "फंगल"
          - "फफूंद*"
          - "घाव*"
          - "फोड़े"
          - "फोड़ों"
          - "फुंसी*"
          - "एलर्जी"
          - "त्वचा रोग*"
          - "चर्म रोग*"
          - "त्वचा विकार*"
          - "त्वचा की बीमारी"
          - "त्वचा की बीमारियों"
        max_gap: 4
      - kind: verb_condition
        form: transliterated
        verbs: ["thik kar*", "thik ho*", "ilaj*", "elaj*", "upchar*", "chikitsa", "ramban", "nidan"]
        conditions:
          - "munhase"
          - "muhanse"
          - "munhaso"
          - "pimple*"
          - "dane"
          - "ekjima"
          - "egjima"
          - "sorayasis"
          - "dad"
          - "sankraman"
          - "infection*"
          - "fungal"
          - "ghav*"
          - "fode"
          - "funsi*"
          - "elarji"
          - "allergy"
          - "twacha rog*"
          - "charm rog*"
          - "twacha vikar*"
        max_gap: 4
      - kind: verb_condition
        form: hinglish
        verbs: ["ठीक कर*", "ठीक हो*", "इलाज*", "ilaj*", "elaj*", "upchar*", "thik kar*", "thik ho*", "cure*", "treat*", "heal*"]
        conditions:
          - "acne"
          - "pimple*"
          - "eczema"
          - "psoriasis"
          - "dermatitis"
          - "rosacea"
          - "ringworm"
          - "fungal"
          - "infection*"
          - "allergy"
          - "wound*"
          - "skin disease*"
          - "skin disorder*"
          - "skin condition*"
          - "मुंहासे"
          - "एक्जिमा"
          - "सोरायसिस"
          - "दाद"
          - "munhase"
          - "dad"
        max_gap: 4
    examples:
      hi_positive:
        - { text: "यह क्रीम एक्ज़िमा को सात दिन में ठीक करती है।", form: devanagari }
        - { text: "मुँहासों का पक्का इलाज, आज़माइए हमारा फेस वॉश।", form: devanagari }
        - { text: "सोरायसिस का उपचार करे यह तेल।", form: devanagari }
        - { text: "Eczema ka ilaaj ab ghar baithe.", form: transliterated }
        - { text: "Dad aur fungal infection ko thik kare.", form: transliterated }
        - { text: "Yeh cream pimples ko cure karti hai, इलाज गारंटीड।", form: hinglish }
        - { text: "Acne ka इलाज sirf 7 din mein.", form: hinglish }
      hi_negative:
        - { text: "मुंहासों वाली त्वचा के लिए हल्का फेस वॉश।", form: devanagari }
        - { text: "यह फेस वॉश तैलीय त्वचा को साफ़ करता है।", form: devanagari }
        - { text: "Acne-prone skin ke liye gentle face wash.", form: transliterated }
        - { text: "Tel ko thik se lagayein aur halke haath se massage karein.", form: transliterated }
        - { text: "Oily skin ke लिए daily cleanser.", form: hinglish }
      en_positive:
        - "This cream cures eczema in seven days."
        - "A face wash that treats pimples."
      en_negative:
        - "A gentle face wash for acne-prone skin."
        - "Cleanses oily skin."
    open_questions:
      - "Is 'दूर करे' (removes) for pimples and acne a treatment claim? The English rule does not flag 'removes'; this draft does not flag 'दूर कर*' either."
      - "Is 'खुजली' (itching) a condition (flag) or a symptom a cosmetic may soothe (allow)? Left out of the draft."
      - "Please list the spellings and colloquial forms of these conditions that listings actually use (मुँहासे, मुहाँसे, दाने, फुंसी, छाले)."
      - "Is 'jad se khatam' / 'जड़ से खत्म' (eliminates from the root), as in 'pimples ko jad se khatam karta hai', a cure claim (block) or an efficacy and permanence claim (review)? The draft flags neither; the public checker shows a draft notice on Hindi copy."

  - id: HI-DMR-001
    category: dmr_disease
    maps_to: EN-DMR-001
