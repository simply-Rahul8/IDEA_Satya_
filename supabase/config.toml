# Supabase local/CLI config (auth). Hosted-project equivalents are listed in docs/deploy.md.
[auth]
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://localhost:8000/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600            # seconds

[auth.email.smtp]           # P28: Resend free tier; secrets only via env
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(SMTP_FROM_EMAIL)"
sender_name = "Satya"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
