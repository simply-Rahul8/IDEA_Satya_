[project]
name = "satya"
version = "0.0.0"
description = "Claim-safe beauty listing engine for Indian D2C brands (private)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "sentry-sdk>=2.73.0",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "docs/qa"]  # QA scratch probes, not product code

[tool.ruff.lint.per-file-ignores]
"web/app.py" = ["E501"]  # inline SVG path data and the HTMX config string

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
package = false
